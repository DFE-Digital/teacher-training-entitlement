    features:
      show:
        registration_open_html: |
          <p class="govuk-body">When this feature is turned on, registration is open. Users can register for a course as normal.</p>
          <p class="govuk-body">When this feature is turned off, registration is closed. Users cannot register for a course, unless the <a href="/admin/features/Closed%20registration%20enabled" class="govuk-link">Closed registration enabled</a> feature is turned on to allow certain users to register late.</p>
        closed_registration_enabled_html: |
          <p class="govuk-body">When this feature is turned on, specified users can register for a course even when the service is closed to the general public.</p>
          <p class="govuk-body">Use the <a href="/admin/features/Registration%20open" class="govuk-link">Registration open</a> feature flag if you need to close the service to the general public.
          <p class="govuk-body">To view or manage who can register while the service is closed, visit <a href="/admin/closed_registration_users" class="govuk-link">Closed registration users</a>.</p>
          <p class="govuk-body">When both the Registration open and Closed registration enabled feature flags are turned off, no one will be able to register.</p>
        declarations_require_delivery_partner_html: |
          <p class="govuk-body">When this feature is turned on, submitting a declaration for the 2024 cohort onwards will require the delivery partner to be included.</p>
          <p class="govuk-body">When this feature is turned off, submitting a declaration does not require a delivery partner, but will still accept a declaration with a delivery partner.</p>
        maintenance_banner_html: '<p class="govuk-body">When this feature is
          turned on, a banner will be displayed at the top of every page to inform
          users that the service is down for maintenance.</p>

          '
        dfe_analytics_enabled_html: '<p class="govuk-body">When this feature
          is turned on, events will be sent to DfE Analytics.</p>

          '
        lead_provider_transferred_declarations_visibility_html: '<p class="govuk-body">When
          this feature is turned on, lead providers can see transferred declarations.</p>

          '
        use_suffixed_cohorts_html: |
          <p class="govuk-body">When turned on any new applications will be assigned to the latest suffixed cohort<p>
          <p class="govuk-body">When turned off any new applications will be assigned to the latest cohort with a suffix of 1</p>
          <p class"govuk-body">This enables the rollout of suffixed cohorts</p>
