servers:
- url: "/"
  description: API endpoint
components:
  securitySchemes:
    api_key:
      description: Bearer token
      type: apiKey
      name: Authorization
      in: header
  schemas:
    PaginationFilter:
      description: Pagination options to navigate through the list of results.
      type: object
      properties:
        page:
          type: integer
          description: The page number to paginate to in the collection. If no value
            is specified it defaults to the first page.
          example: 1
        per_page:
          type: integer
          description: The number items to display on a page. Defaults to 100. Maximum
            is 3000, if the value is greater that the maximum allowed it will fallback
            to 3000.
          example: 10
    ListApplicationsFilter:
      description: Filter applications to return more specific results
      type: object
      properties:
        cohort:
          description: Return only applications from the specified cohort or cohorts.
            This is a comma delimited string of years.
          type: string
          example: '2021,2022'
        updated_since:
          description: Return only records that have been updated since this date
            and time (ISO 8601 date format).
          type: string
          example: '2021-05-13T11:21:55Z'
        participant_id:
          description: Return only applications from the specified participant or
            participants. This is comma delimited string of participant IDs.
          type: string
          example: 7e5bcdbf-c818-4961-8da5-439cab1984e0,c2a7ef98-bbfc-48c5-8f02-d484071d2165
    ListParticipantsFilter:
      description: Filter applications to return more specific results
      type: object
      properties:
        updated_since:
          description: Return only records that have been updated since this date
            and time (ISO 8601 date format).
          type: string
          example: '2021-05-13T11:21:55Z'
        training_status:
          description: Return only records that have this training status
          type: string
          enum:
          - active
          - deferred
          - withdrawn
          example: active
        from_participant_id:
          description: Return only records that have this from Participant ID
          type: string
          example: 7e5bcdbf-c818-4961-8da5-439cab1984e0
    ListParticipantDeclarationsFilter:
      description: Refine participant declarations to return.
      type: object
      properties:
        participant_id:
          description: The unique id of the participant
          type: string
          example: 7e5bcdbf-c818-4961-8da5-439cab1984e0
        updated_since:
          description: Return only records that have been updated since this date
            and time (ISO 8601 date format).
          type: string
          example: '2021-05-13T11:21:55Z'
        cohort:
          description: Return participant declarations associated to the specified
            cohort or cohorts. This is a comma delimited string of years.
          type: string
          example: '2021,2022'
    ListParticipantOutcomesFilter:
      description: Filter outcomes to return more specific results
      type: object
      properties:
        created_since:
          description: Return only records that have been created since this date
            and time (ISO 8601 date format)
          type: string
          example: '2021-05-13T11:21:55Z'
    ListStatementsFilter:
      description: Filter statements to return more specific results
      type: object
      properties:
        cohort:
          description: Return statements associated to the specified cohort or cohorts.
            This is a comma delimited string of years.
          type: string
          example: '2021,2022'
        updated_since:
          description: Return only records that have been updated since this date
            and time (ISO 8601 date format)
          type: string
          example: '2021-05-13T11:21:55Z'
    UnauthorisedResponse:
      description: Authorization information is missing or invalid.
      type: object
      properties:
        error:
          type: string
          example: 'HTTP Token: Access denied'
    NotFoundResponse:
      description: The requested resource was not found.
      type: object
      properties:
        error:
          type: string
          description: Resource not found
      example:
        error: Resource not found
    BadRequestResponse:
      description: The request body did not match the expected payload.
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                example: Bad request
              detail:
                type: string
                example: correct json data structure required. See API docs for reference
    UnprocessableEntityResponse:
      description: The payload was not valid. See the errors for more information.
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                example: example_attribute
              detail:
                type: string
                example: An '#/example_attribute' must be specified.
    IDAttribute:
      description: The unique ID of the resource.
      type: string
      format: uuid
      example: d0b4a32e-a272-489e-b30a-cb17131457fc
    ApplicationResponse:
      description: A single application
      type: object
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/Application"
    ApplicationsResponse:
      description: A list of applications.
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Application"
    Application:
      description: A single application
      type: object
      required:
      - id
      - type
      - attributes
      properties:
        id:
          "$ref": "#/components/schemas/IDAttribute"
        type:
          description: The data type
          type: string
          example: application
          enum:
          - application
        attributes:
          properties:
            course_identifier:
              description: The course this application relates to
              type: string
              nullable: false
              example: tte-early-years
              enum:
              - tte-early-years
            email:
              description: The email address registered for this participant
              type: string
              nullable: false
              example: isabelle.macdonald2@some-school.example.com
            email_validated:
              description: Indicates whether the email address has been validated
              type: boolean
              example: true
            full_name:
              description: The full name of this participant
              type: string
              nullable: false
              example: Isabelle MacDonald
            funding_choice:
              description: Indicates how this participant has said they will funded
                their training
              type: string
              nullable: true
              example: school
              enum:
              - school
              - trust
              - self
              - another
              - employer
            ineligible_for_funding_reason:
              description: Indicates why this participant is not eligible for DfE
                funding
              type: string
              nullable: true
              example: previously-funded
              enum:
              - previously-funded
              - establishment-ineligible
            participant_id:
              description: The unique identifier of this participant
              type: string
              example: 7a8fef46-3c43-42c0-b3d5-1ba5904ba562
              format: uuid
            private_childcare_provider_urn:
              description: The Unique Reference Number (URN) of the private child
                care provider
              type: string
              example: EY944860
              nullable: true
            teacher_reference_number:
              description: The Teacher Reference Number (TRN) for this participant
              type: string
              example: '1234567'
              nullable: true
            school_urn:
              description: The Unique Reference Number (URN) of the school where this
                participant is employed
              type: string
              example: '106286'
            school_ukprn:
              description: The UK Provider Reference Number (UK Provider Reference
                Number) of the school where this participant is employed
              nullable: true
              type: string
              example: '10079319'
            status:
              description: The current state of the application
              type: string
              nullable: true
              example: pending
              enum:
              - pending
              - accepted
              - rejected
            reason_for_rejection:
              description: The reason why the application was rejected by the lead
                provider
              type: string
              nullable: true
              example: Application does not meet eligibility criteria
            works_in_school:
              description: Indicates whether the participant is currently employed
                by school
              type: boolean
              example: true
            cohort:
              description: Indicates which call-off contract would fund this participant's
                training. 2021 indicates a participant that has started, or will start,
                their training in the 2021/22 academic year. Once a provider accepts
                an application, they may change a participant's cohort up until the
                point of submitting a started declaration.
              type: string
              nullable: true
              example: '2022'
            eligible_for_funding:
              description: Indicates whether this participant would be eligible for
                funding from the DfE
              type: boolean
              example: true
            teacher_catchment:
              description: This field will indicate whether or not the participant
                is UK-based. <ul><li>If <code>true</code> then the registration relates
                to a participant who is UK-based.</li><li>If <code>false</code> then
                the registration relates to a participant who is not UK-based.</li></ul>
              nullable: true
              type: boolean
              example: true
            teacher_catchment_country:
              description: This field shows the text entered by the participant during
                their online registration.
              nullable: true
              type: string
              example: United Kingdom of Great Britain and Northern Ireland
            teacher_catchment_iso_country_code:
              description: |-
                This field identifies which non-UK country the participant has registered from.
                The API uses <a href="https://www.iso.org/iso-3166-country-codes.html" class="govuk-link" rel="noreferrer noopener" target="_blank">ISO 3166 alpha-3 codes</a>, three-letter codes published by the International Organization for Standardization (ISO) to represent countries, dependent territories, and special areas of geographical interest.
              nullable: true
              type: string
              example: GBR
            funded_place:
              description: Indicates whether or not this participant’s training is
                being funded by DfE
              nullable: true
              type: boolean
              example:
            created_at:
              description: The date the application was created
              type: string
              nullable: false
              format: date-time
              example: '2021-05-31T02:21:32.000Z'
            updated_at:
              description: The date the application was last updated
              type: string
              nullable: false
              format: date-time
              example: '2021-05-31T02:22:32.000Z'
            schedule_identifier:
              description: The new schedule of the participant
              nullable: true
              type: string
              example: tte-reception-autumn
              enum:
              - tte-reception-autumn
              - tte-reception-spring
    ApplicationAcceptRequest:
      description: An application acceptance request
      type: object
      required:
      - data
      properties:
        data:
          description: An application acceptance request data
          type: object
          required:
          - type
          - attributes
          properties:
            type:
              description: The data typed
              type: string
              required: true
              example: application-accept
            attributes:
              description: An application acceptance request attributes
              type: object
              required: false
              properties:
                funded_place:
                  description: Whether the participant has a funded place
                  nullable: false
                  type: boolean
                  example: true
                schedule_identifier:
                  description: The new schedule of the participant
                  nullable: false
                  type: string
                  example: tte-reception-autumn
                  enum:
                  - tte-reception-autumn
                  - tte-reception-spring
    ApplicationChangeFundedPlaceRequest:
