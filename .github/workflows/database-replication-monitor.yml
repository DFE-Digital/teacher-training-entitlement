name: Monitor Database logical replication

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to fix
        required: true
        default: sandbox
        type: choice
        options:
          - sandbox
          - production
  schedule:
    - cron: "0 0,6,12,18 * * *"
  push:
    branches:
      - 3153-tte-airbyte-postgres-monitor

permissions:
  id-token: write

env:
  SERVICE_NAME: teacher-training-entitlement
  SERVICE_SHORT: cpdtte
  TF_VARS_PATH: terraform/application/config/$${{ inputs.environment || 'sandbox' }}.tfvars.json

jobs:
  monitor-wal-usage:
    name: Parallel postgres monitor
    environment:
      name: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [sandbox,production]
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Monitor ${{ matrix.environment }}
      uses: DFE-Digital/github-actions/monitor-postgres-wal@master
      with:
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        environment: ${{ matrix.environment }}
        teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
        service: ${{ vars.TEAMS_MSG_SERVICE_NAME }}
        app-name: ${{ env.SERVICE_NAME }}-${{ matrix.environment }}
        tf-vars-path: ${{ env.TF_VARS_PATH }}