name: "Deploy"

# Pull request review apps. Tests and lint run once per push in rspec.yml (CI and deploy), which also owns main builds and deployments.
# Review apps remain build-only dependent, as before: they do not wait for the push checks.
concurrency: build_and_deploy_${{ github.ref_name }}

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, labeled]

env:
  TERRAFORM_BASE: terraform/application
  HEALTHCHECK_CMD: "healthcheck"

permissions:
  contents: read
  id-token: write
  pull-requests: write
  packages: write

jobs:
  openapi:
    name: Lead Provider OpenAPI Check
    uses: ./.github/workflows/lead_provider_openapi_check.yml

  build:
    name: Build
    env:
      DOCKER_REPOSITORY: ghcr.io/dfe-digital/teacher-training-entitlement
    outputs:
      docker-image-tag: ${{ steps.build-image.outputs.tag }}
      docker-image: ${{ steps.build-image.outputs.image }}
    permissions:
      packages: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        name: Checkout
        with:
          # The image is tagged with the PR head SHA, so build that commit (not the
          # synthetic merge commit) to keep contents and tag aligned.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build and push docker image
        id: build-image
        uses: DFE-Digital/github-actions/build-docker-image@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          context: .
          docker-repository: ${{ env.DOCKER_REPOSITORY }}
          max-cache: true
          reuse-cache: true
          snyk-token: ${{ secrets.SNYK_TOKEN }}

  deploy-review-app:
    name: Deployment To Review
    concurrency: deploy_review_${{ github.event.pull_request.number }}
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy') }}
    needs: [build]
    environment:
      name: review
      url: ${{ steps.deploy_review.outputs.environment_url }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write

    steps:
      - name: Deploy App to Review
        id: deploy_review
        uses: DFE-Digital/github-actions/deploy-to-aks@master
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          environment: review
          pr-number: ${{ github.event.pull_request.number }}
          sha: ${{ needs.build.outputs.docker-image-tag }}
          terraform-base: ${{ env.TERRAFORM_BASE }}
          healthcheck: ${{ env.HEALTHCHECK_CMD }}
          db-seed: true
          # smoke-test: true
          gcp-wip: ${{ vars.GCP_WIP }}
          gcp-project-id: ${{ vars.GCP_PROJECT_ID }}
